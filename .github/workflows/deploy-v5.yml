name: Deploy Loop v5 (extract upload package)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract v5 package over repo
        run: |
          set -e
          rm -rf /tmp/v5 && mkdir -p /tmp/v5
          unzip -o loop-app-v5-upload.zip -d /tmp/v5
          echo "--- package top-level listing ---"
          ls -la /tmp/v5
          SRC=$(find /tmp/v5 -maxdepth 3 -name app.py | head -1 | xargs dirname)
          echo "SRC=$SRC"
          test -n "$SRC"
          echo "--- package tree (depth 2) ---"
          find "$SRC" -maxdepth 2 | sort | head -60
          cp -r "$SRC"/. ./
          rm -f loop-app-v5-upload.zip loop.db
          echo "--- verify fix markers ---"
          grep -q "profile-cover" templates/profile.html && echo "profile-cover OK"
          grep -q "Edit profile" templates/profile.html && echo "Edit profile OK"
          SIZE=$(wc -c < static/style.css | tr -d ' ')
          echo "static/style.css size: $SIZE bytes"
          if [ "$SIZE" -lt 10000 ] || [ "$SIZE" -gt 10600 ]; then
            echo "ERROR: style.css size $SIZE is far from expected 10331"
            exit 1
          fi
          test ! -e loop.db && echo "no loop.db OK"
          echo "--- verification passed ---"

      - name: Remove temp workflow and commit
        run: |
          set -e
          rm -f .github/workflows/deploy-v5.yml
          git config user.name "moonlitmgmt"
          git config user.email "moonlitmgmt@users.noreply.github.com"
          git add -A
          echo "--- status ---"
          git status --short
          echo "--- diff stat ---"
          git diff --cached --stat
          git commit -m "Deploy Loop v5: Facebook-style profile header fix" || echo "nothing to commit"
          git push
