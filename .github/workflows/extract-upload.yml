name: Extract uploaded source package
on:
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip and clean up
        run: |
          set -euo pipefail
          unzip -o loop-app-upload.zip -d __extracted__
          shopt -s dotglob nullglob
          entries=(__extracted__/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            src="${entries[0]}"
          else
            src="__extracted__"
          fi
          for f in "$src"/*; do
            mv "$f" .
          done
          rm -rf __extracted__ loop-app-upload.zip
          rm -rf uploads venv .venv env __pycache__
          find . -path ./.git -prune -o -maxdepth 2 \( -name "*.db" -o -name "*.sqlite" -o -name "*.sqlite3" \) -print -delete || true
          echo "--- extracted tree ---"
          find . -path ./.git -prune -o -maxdepth 2 -print | sort
      - name: Commit extracted files
        run: |
          git config user.name "moonlitmgmt"
          git config user.email "moonlitmgmt@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Add Loop app source files (extracted from upload package)" || echo "nothing to commit"
          git push
