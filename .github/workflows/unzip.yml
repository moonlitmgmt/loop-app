name: Unzip v3 upload

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract v3 package and remove zip
        run: |
          unzip -o loop-app-v3-upload.zip
          rm -f loop-app-v3-upload.zip
          ls templates static
      - name: Commit extracted files
        run: |
          git config user.name "moonlitmgmt"
          git config user.email "moonlitmgmt@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Deploy Loop v3: restyled UI plus Phase 1, 2 and 3"
          git push
