name: Unzip Loop v5.3 package
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v5.3 package
        run: |
          set -euo pipefail
          rm -rf /tmp/v53
          mkdir -p /tmp/v53
          unzip -o loop-app-v5-3-upload.zip -d /tmp/v53
          # Flatten a single top-level wrapper folder if present
          top="$(find /tmp/v53 -mindepth 1 -maxdepth 1)"
          if [ "$(echo "$top" | wc -l)" -eq 1 ] && [ -d "$top" ]; then
            shopt -s dotglob
            mv "$top"/* /tmp/v53/
            rmdir "$top"
            shopt -u dotglob
          fi
          rsync -a --delete-after --exclude='.git' --exclude='loop-app-v5-3-upload.zip' --exclude='.github/workflows/unzip-v53.yml' /tmp/v53/ .
          rm -f loop-app-v5-3-upload.zip
          # --- Verify v5.3 contents ---
          grep -q "loop-static-v3" static/sw.js || { echo "FAIL: loop-static-v3 missing in static/sw.js"; exit 1; }
          grep -q "width:168px" templates/profile.html || { echo "FAIL: width:168px missing in templates/profile.html"; exit 1; }
          if [ -e loop.db ]; then echo "FAIL: loop.db present at root"; exit 1; fi
          find . -path ./.git -prune -o -name 'loop.db' -print | grep -q . && { echo "FAIL: loop.db found in tree"; exit 1; } || true
          echo "v5.3 verification passed"
          ls -la
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Deploy Loop v5.3: inline avatar widths + SW cache loop-static-v3"
